name: Android APK

on:
  push:
    branches: [android]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK; Gradle comes from setup-gradle (no wrapper jar in the repo)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: multicuenta-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
